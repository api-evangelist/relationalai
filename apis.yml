aid: relationalai
name: RelationalAI
description: >-
  RelationalAI is a decision-intelligence platform delivered as a Native App
  inside Snowflake. Its core product, Rel, builds a semantic model from data in
  Snowflake and reasons over it — combining graph analytics, rules, predictive
  graph neural networks, and prescriptive optimization — to answer high-stakes
  business questions (supply chain, pricing, inventory, demand forecasting) with
  transparent, validatable reasoning steps. Developers work through PyRel (the
  `relationalai` Python SDK), the `rai` CLI, and per-language HTTP SDKs
  (JavaScript, Julia, Java), with queries compiled to the protobuf Logical Query
  Protocol (LQP) and executed on RelationalAI engines running in Snowflake.
  RelationalAI publishes its own coding-agent Skills to drive the workflow.
